name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin typecheck, tests, boundaries, build & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm boundaries
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high

  design-system:
    name: Design system Storybook build & a11y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:storybook
      - run: pnpm --filter @fathomark/design-system exec playwright install --with-deps chromium
      - run: pnpm run test:ds
