packages:
  - plugin
  - design-system

# Moved up from design-system/pnpm-workspace.yaml when the root became the
# workspace root. A nested workspace file would make pnpm treat design-system as
# its own root again, which is what produced two copies of React.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
minimumReleaseAgeExclude:
  - cn@0.3.2
