<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fathomark 기능별 설계 문서 안내</title><style>
:root{color-scheme:light;--navy:#17314f;--text:#263746;--muted:#647486;--line:#d9e2eb;--blue:#2368aa;--paper:#fff;--wash:#f4f7fa}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;color:var(--text);background:var(--wash);font:16px/1.85 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.layout{display:grid;grid-template-columns:230px minmax(0,1100px);max-width:1380px;margin:0 auto;gap:30px;padding:35px 24px 90px}aside{position:sticky;top:28px;align-self:start;max-height:90vh;overflow:auto;padding:10px 0}aside strong{display:block;font-size:18px;color:var(--navy);margin-bottom:12px}nav a{display:block;margin:7px 0;text-decoration:none;color:var(--muted);font-size:14px;line-height:1.6;padding:4px 0}nav a:hover{color:var(--blue)}
main{min-width:0;background:var(--paper);padding:48px 48px 65px;border-radius:14px}h1{font-size:32px;line-height:1.4;letter-spacing:-.03em;color:var(--navy);margin:0 0 24px}h2{font-size:25px;line-height:1.5;letter-spacing:-.02em;color:var(--navy);margin:55px 0 18px;padding-top:20px;border-top:1px solid var(--line)}h3{font-size:20px;color:var(--navy);margin:30px 0 14px}h4{font-size:17px;margin:24px 0 10px}p{margin:13px 0}a{color:var(--blue);overflow-wrap:anywhere}code{font-size:.9em;background:#eef3f8;padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}pre{overflow:auto;background:#f2f5f8;border-radius:6px;padding:16px;line-height:1.65}pre code{padding:0;background:none}blockquote{margin:20px 0;padding:10px 20px;border-left:3px solid #df9d70;background:#fff7f0}ul,ol{padding-left:25px}li{margin:6px 0}strong{color:var(--navy)}.table-scroll{max-width:100%;overflow-x:auto;margin:20px 0}table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.7}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{background:#f1f5f9;color:var(--navy);font-weight:600}figure{margin:24px 0 8px}.diagram{border:0;padding:0;background:transparent;width:100%;cursor:zoom-in}.diagram img{display:block;width:100%;height:auto}.caption{font-size:13px;color:var(--muted);margin:8px 0 24px}.actions{display:flex;gap:10px;margin:25px 0;font-size:14px}.actions button{font:inherit;color:var(--blue);background:#eef4fa;border:1px solid var(--line);border-radius:5px;padding:7px 12px;cursor:pointer}
dialog{border:0;border-radius:8px;max-width:96vw;max-height:96vh;padding:40px 12px 12px}dialog::backdrop{background:rgba(12,23,38,.8)}dialog img{display:block;max-width:90vw;max-height:86vh;width:auto;height:auto;object-fit:contain}dialog button{position:absolute;right:12px;top:7px;border:0;background:#eef3f8;border-radius:4px;padding:5px 12px;cursor:pointer;font:inherit}
@media(max-width:1000px){.layout{grid-template-columns:1fr;padding:16px;gap:15px}aside{position:static;max-height:none}nav{display:flex;flex-wrap:wrap;gap:8px 15px}nav a{margin:0}main{padding:28px 22px}h1{font-size:27px}h2{font-size:22px}}
@media print{@page{size:A4;margin:17mm}body{background:#fff;font-size:10pt;line-height:1.65}.layout{display:block;padding:0;max-width:none}aside,.actions,dialog{display:none!important}main{padding:0;border-radius:0}h1{font-size:23pt}h2{font-size:17pt;margin:28px 0 12px;break-after:avoid}h3{font-size:13pt;break-after:avoid}figure{break-inside:avoid}.diagram img{max-height:240mm;object-fit:contain}table{font-size:9pt}tr{break-inside:avoid}pre{white-space:pre-wrap}a{color:inherit;text-decoration:none}.table-scroll{overflow:visible}}
</style></head><body><div class="layout"><aside><strong>Fathomark 기능별 문서</strong><nav><a href="workflow/README.html">전체 문서 목차</a><a href="workflow/tools/README.html">도구별 문서 목차</a><hr></nav><div class="actions"><button onclick="window.print()">인쇄</button></div></aside><main><h1>Fathomark 기능별 설계 문서 안내</h1>
<p>기존 단일 문서의 본문을 기능별 문서로 분리했다. 전체 흐름과 실행 책임은 각각의 문서에서, 도구별 기능·요구사항·워크플로우·시각화·검증 기준은 각 도구 문서에서 관리한다.</p>
<ul>
<li><a href="workflow/README.html">기능별 문서 목차</a></li>

<li><a href="workflow/overall-workflow.html">전체 워크플로우</a></li>

<li><a href="workflow/agent-loop.html">Agent Loop</a></li>
</ul>
<p>모든 문서는 설계 초안이며 현재 구현 상태와 구분한다. 열람용 HTML도 동일한 구조로 나뉘어 있다.</p>
</main></div><dialog id="image-dialog"><button id="close-image" type="button">닫기</button><img alt="확대한 다이어그램"></dialog><script>const dialog=document.getElementById('image-dialog');document.querySelectorAll('.diagram').forEach(button=>button.addEventListener('click',()=>{const image=button.querySelector('img');dialog.querySelector('img').src=image.src;dialog.querySelector('img').alt=image.alt;dialog.showModal()}));document.getElementById('close-image').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});</script></body></html>
